<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ELEKTRO SCENA 3D">
<title>ELEKTRO SCENA — 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { 
    width: 100%;
    height: 100%;
    position: fixed;
    overflow: hidden; 
    background: #1a1a1a; 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    touch-action: none;
  }
  body {
    top: 0;
    left: 0;
  }
  #info {
    position: fixed; 
    top: 12px; 
    left: 12px; 
    right: 12px;
    z-index: 10;
    background: rgba(0,0,0,0.85);
    padding: 14px 16px; 
    border-radius: 8px;
    border: 1px solid #333;
    pointer-events: none; 
    user-select: none;
    font-size: 13px;
  }
  #info h1 { 
    margin: 0 0 8px; 
    font-size: 16px; 
    font-weight: bold;
    letter-spacing: 0.5px; 
    color: #00ffff;
    text-shadow: 0 0 8px #00ffff; 
  }
  #info p { 
    margin: 4px 0; 
    font-size: 11px; 
    color: #999; 
    line-height: 1.5; 
  }
  #info strong { color: #00ff00; }
  #canvas { 
    position: fixed;
    display: block;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
  }
</style>
</head>
<body>

<div id="info">
  <h1>⚡ ELEKTRO SCENA 3D</h1>
  <p><strong>Dotyk + przeciąg</strong> = obrót | <strong>Pinch</strong> = zoom</p>
  <p>10m × 30m | LED RGB | 12x Reflektory</p>
</div>
<canvas id="canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/controls/OrbitControls.js"></script>

<script>
// ===== SCENE SETUP =====
const canvas = document.getElementById('canvas');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
scene.fog = new THREE.Fog(0x0a0a0a, 80, 150);

// Responsive camera
let width = window.innerWidth;
let height = window.innerHeight;
const camera = new THREE.PerspectiveCamera(55, width / height, 0.1, 300);
camera.position.set(30, 16, 30);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2 - 0.1;
controls.minDistance = 12;
controls.maxDistance = 70;
controls.autoRotate = false;
controls.enableZoom = true;
controls.enablePan = true;

// ===== LIGHTING =====
const ambientLight = new THREE.AmbientLight(0x4a4a6a, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(-20, 35, 25);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 100;
dirLight.shadow.camera.left = -40;
dirLight.shadow.camera.right = 40;
dirLight.shadow.camera.top = 40;
dirLight.shadow.camera.bottom = -20;
dirLight.shadow.bias = -0.0012;
scene.add(dirLight);

const sideLight1 = new THREE.DirectionalLight(0xff00ff, 0.3);
sideLight1.position.set(-30, 15, 0);
scene.add(sideLight1);

const sideLight2 = new THREE.DirectionalLight(0x00ffff, 0.25);
sideLight2.position.set(30, 15, 0);
scene.add(sideLight2);

// ===== MATERIALS =====
const matStage = new THREE.MeshStandardMaterial({ 
  color: 0x2a2a2a, 
  roughness: 0.8, 
  metalness: 0.1
});

const matTruss = new THREE.MeshStandardMaterial({ 
  color: 0xb0b0b0, 
  roughness: 0.5, 
  metalness: 0.6 
});

const matLEDpanel = new THREE.MeshStandardMaterial({ 
  color: 0x1a1a1a, 
  roughness: 0.2, 
  metalness: 0.4,
  emissive: 0x222222,
  emissiveIntensity: 0.3
});

const matReflector = new THREE.MeshStandardMaterial({
  color: 0x404040,
  roughness: 0.3,
  metalness: 0.7
});

const matBarrier = new THREE.MeshStandardMaterial({
  color: 0x8b4513,
  roughness: 0.9,
  metalness: 0.05
});

const edgeMat = new THREE.LineBasicMaterial({ color: 0x555555, linewidth: 1 });

// ===== HELPER FUNCTIONS =====
function createBox(w, h, d, material, x, y, z, parent = scene) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  
  const edges = new THREE.EdgesGeometry(geo);
  const lines = new THREE.LineSegments(edges, edgeMat);
  mesh.add(lines);
  
  parent.add(mesh);
  return mesh;
}

function createCylinder(radiusTop, radiusBottom, height, material, x, y, z, parent = scene) {
  const geo = new THREE.CylinderGeometry(radiusTop, radiusBottom, height, 12);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// ===== GROUND =====
const gridHelper = new THREE.GridHelper(60, 60, 0x333333, 0x1a1a1a);
gridHelper.position.y = 0.02;
scene.add(gridHelper);

const groundPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.ShadowMaterial({ opacity: 0.3 })
);
groundPlane.rotation.x = -Math.PI / 2;
groundPlane.position.y = 0.01;
groundPlane.receiveShadow = true;
scene.add(groundPlane);

// ===== STAGE PODIUM =====
createBox(10, 1.3, 30, matStage, 0, 0.65, 0);
createBox(10.2, 0.05, 30.2, new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.8, roughness: 0.3 }), 0, 1.3, 0);

// ===== FRONT LED PANEL =====
const ledFrontGeo = new THREE.BoxGeometry(10, 4, 0.25);
const ledFrontMat = new THREE.MeshStandardMaterial({
  color: 0x000000,
  roughness: 0.2,
  metalness: 0.3,
  emissive: 0x440044,
  emissiveIntensity: 0.7
});
const ledFront = new THREE.Mesh(ledFrontGeo, ledFrontMat);
ledFront.position.set(0, 1.3 + 2, -15.15);
ledFront.castShadow = true;
ledFront.receiveShadow = true;
scene.add(ledFront);

// LED Pixels - optymalizacja dla mobile
for (let row = 0; row < 4; row++) {
  for (let col = 0; col < 5; col++) {
    const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff];
    const randColor = colors[Math.floor(Math.random() * colors.length)];
    const pixelMat = new THREE.MeshStandardMaterial({
      color: randColor,
      emissive: randColor,
      emissiveIntensity: 0.4,
      metalness: 0.2,
      roughness: 0.3
    });
    const pixel = new THREE.Mesh(
      new THREE.BoxGeometry(1.8, 0.9, 0.05),
      pixelMat
    );
    pixel.position.set(
      -4.5 + col * 2,
      1.3 + 0.5 + row * 1,
      -15.1
    );
    scene.add(pixel);
  }
}

// Wsparcie LED
createBox(0.4, 4.5, 0.4, matTruss, -5.1, 1.3 + 2.25, -14.5);
createBox(0.4, 4.5, 0.4, matTruss, 5.1, 1.3 + 2.25, -14.5);

// ===== SIDE LEDs =====
const ledLeftMat = new THREE.MeshStandardMaterial({
  color: 0x000000,
  emissive: 0xff0000,
  emissiveIntensity: 0.6
});
createBox(0.2, 3.5, 3.5, ledLeftMat, -5.15, 1.3 + 1.75, -12.75);

const ledRightMat = new THREE.MeshStandardMaterial({
  color: 0x000000,
  emissive: 0x00ff00,
  emissiveIntensity: 0.6
});
createBox(0.2, 3.5, 3.5, ledRightMat, 5.15, 1.3 + 1.75, -12.75);

createBox(0.3, 0.3, 3.7, matTruss, -5.15, 1.3 + 3.9, -12.75);
createBox(0.3, 0.3, 3.7, matTruss, 5.15, 1.3 + 3.9, -12.75);

// ===== TOP RIG TRUSS =====
const rigHeight = 12;
createBox(10.6, 1, 21, matTruss, 0, rigHeight, -1);

createBox(0.4, rigHeight - 1.3, 0.4, matTruss, -5.3, 1.3 + (rigHeight - 1.3)/2, 9);
createBox(0.4, rigHeight - 1.3, 0.4, matTruss, 5.3, 1.3 + (rigHeight - 1.3)/2, 9);
createBox(0.4, rigHeight - 1.3, 0.4, matTruss, -5.3, 1.3 + (rigHeight - 1.3)/2, -11);
createBox(0.4, rigHeight - 1.3, 0.4, matTruss, 5.3, 1.3 + (rigHeight - 1.3)/2, -11);

createBox(0.25, rigHeight - 3.3, 0.25, matTruss, -2.5, 1.3 + (rigHeight - 3.3)/2, 9);
createBox(0.25, rigHeight - 3.3, 0.25, matTruss, 2.5, 1.3 + (rigHeight - 3.3)/2, 9);
createBox(0.25, rigHeight - 3.3, 0.25, matTruss, -2.5, 1.3 + (rigHeight - 3.3)/2, -11);
createBox(0.25, rigHeight - 3.3, 0.25, matTruss, 2.5, 1.3 + (rigHeight - 3.3)/2, -11);

// ===== FRONT ROOF TRUSS =====
const frontRigHeight = 7.5;
createBox(10.6, 0.8, 4.5, matTruss, 0, frontRigHeight, -13.5);
createBox(0.3, frontRigHeight - 1.3, 0.3, matTruss, -5.1, 1.3 + (frontRigHeight - 1.3)/2, -14);
createBox(0.3, frontRigHeight - 1.3, 0.3, matTruss, 5.1, 1.3 + (frontRigHeight - 1.3)/2, -14);

// ===== SIDE TRUSSES =====
createBox(0.7, 0.7, 21, matTruss, -5.7, 6, -1);
createBox(0.7, 0.7, 21, matTruss, 5.7, 6, -1);

// ===== LIGHTING FIXTURES (Optymalizacja) =====
const lightRigPositions = [
  [-4, rigHeight - 1.2, -8],
  [-2, rigHeight - 1.2, -4],
  [0, rigHeight - 1.2, 0],
  [2, rigHeight - 1.2, 4],
  [4, rigHeight - 1.2, 8],
  [-3, rigHeight - 1.2, 3],
  [3, rigHeight - 1.2, 3],
  [-2.5, rigHeight - 1.2, -6],
  [2.5, rigHeight - 1.2, -6],
  [0, rigHeight - 1.2, -10],
];

lightRigPositions.forEach((pos, idx) => {
  createBox(0.35, 0.4, 0.5, matReflector, pos[0], pos[1], pos[2]);
  createCylinder(0.18, 0.18, 0.15, new THREE.MeshStandardMaterial({
    color: idx % 3 === 0 ? 0xffdd00 : (idx % 3 === 1 ? 0xff00ff : 0x00ffff),
    emissive: idx % 3 === 0 ? 0xffdd00 : (idx % 3 === 1 ? 0xff00ff : 0x00ffff),
    emissiveIntensity: 0.5
  }), pos[0], pos[1] + 0.3, pos[2]);
  
  const light = new THREE.PointLight(
    idx % 3 === 0 ? 0xffdd00 : (idx % 3 === 1 ? 0xff00ff : 0x00ffff),
    0.6,
    20
  );
  light.position.set(pos[0], pos[1] + 0.5, pos[2]);
  scene.add(light);
});

// ===== FRONT ROOF LIGHTING =====
const frontLightPositions = [
  [-3, frontRigHeight + 0.5, -13.5],
  [0, frontRigHeight + 0.5, -13.5],
  [3, frontRigHeight + 0.5, -13.5],
];

frontLightPositions.forEach((pos) => {
  createBox(0.3, 0.35, 0.45, matReflector, pos[0], pos[1], pos[2]);
  const frontLight = new THREE.PointLight(0xff6600, 0.8, 25);
  frontLight.position.set(pos[0], pos[1], pos[2]);
  scene.add(frontLight);
});

// ===== BARRIERS =====
for (let i = 0; i < 6; i++) {
  const barrierX = -4.5 + i * 1.8;
  createBox(1.2, 1, 0.3, matBarrier, barrierX, 0.5, -16);
}

// ===== ANIMATION LOOP =====
let time = 0;
function animate() {
  requestAnimationFrame(animate);
  
  time += 0.01;
  
  // Pulsowanie LED
  scene.children.forEach(child => {
    if (child.material && child.material.emissiveIntensity !== undefined) {
      if (child.material.emissive && child.material.emissive.getHex && child.material.emissive.getHex() !== 0x000000) {
        child.material.emissiveIntensity = 0.3 + Math.sin(time) * 0.3;
      }
    }
  });
  
  controls.update();
  renderer.render(scene, camera);
}

animate();

// ===== RESPONSIVE RESIZE =====
window.addEventListener('resize', () => {
  width = window.innerWidth;
  height = window.innerHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
}, false);

// ===== PREVENT BOUNCE SCROLL =====
document.body.addEventListener('touchmove', (e) => {
  if (e.target === canvas) {
    e.preventDefault();
  }
}, { passive: false });

</script>
</body>
</html>
