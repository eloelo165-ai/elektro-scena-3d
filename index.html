<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELEKTRO SCENA — Wizualizacja 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    width: 100vw;
    height: 100vh;
    overflow: hidden; 
    background: #f0f0f0; 
    font-family: Arial, sans-serif; 
  }
  #info {
    position: absolute; 
    top: 20px; 
    left: 20px; 
    z-index: 10;
    background: rgba(255,255,255,0.97);
    padding: 20px 24px; 
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    pointer-events: none; 
    user-select: none;
    max-width: 400px;
  }
  #info h1 { 
    margin: 0 0 10px; 
    font-size: 18px; 
    font-weight: bold;
    letter-spacing: 0.5px; 
    color: #000; 
  }
  #info p { 
    margin: 6px 0; 
    font-size: 12px; 
    color: #555; 
    line-height: 1.7; 
  }
  #canvas { 
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<div id="info">
  <h1>⚡ ELEKTRO SCENA 3D</h1>
  <p><strong>Wymiary:</strong> 10m × 30m | Podest: 1.3m | Rig: 12m</p>
  <p><strong>Elementy:</strong> LED front 10×4m + boki | Truss | Oświetlenie</p>
  <p><strong>Sterowanie:</strong> Myszy = obrót | Scroll = zoom</p>
</div>
<canvas id="canvas"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@r128/examples/js/controls/OrbitControls.js"></script>

<script>
// SCENE SETUP
const canvas = document.getElementById('canvas');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f0f0);
scene.fog = new THREE.Fog(0xf0f0f0, 100, 150);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(25, 16, 28);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5, -2);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2 - 0.05;

// LIGHTING
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
dirLight.position.set(-12, 28, 18);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 80;
dirLight.shadow.camera.left = -25;
dirLight.shadow.camera.right = 25;
dirLight.shadow.camera.top = 30;
dirLight.shadow.camera.bottom = -15;
dirLight.shadow.bias = -0.0008;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
fillLight.position.set(15, 12, -8);
scene.add(fillLight);

// MATERIALS
const matPodest = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.85, metalness: 0.05 });
const matDark = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8, metalness: 0.15 });
const matLED = new THREE.MeshStandardMaterial({ color: 0x0d0d0d, roughness: 0.3, metalness: 0.3 });
const matTruss = new THREE.MeshStandardMaterial({ color: 0xd8d8d8, roughness: 0.6, metalness: 0.2 });
const matMetal = new THREE.MeshStandardMaterial({ color: 0xb0b0b0, roughness: 0.5, metalness: 0.4 });

const edgeMat = new THREE.LineBasicMaterial({ color: 0x333333, linewidth: 1 });

// HELPER FUNCTION
function createBox(w, h, d, material, x, y, z, parent = scene) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  
  const edges = new THREE.EdgesGeometry(geo);
  const lines = new THREE.LineSegments(edges, edgeMat);
  mesh.add(lines);
  
  parent.add(mesh);
  return mesh;
}

// GRID & GROUND
const gridHelper = new THREE.GridHelper(50, 50, 0xcccccc, 0xe8e8e8);
gridHelper.position.y = 0.02;
scene.add(gridHelper);

const planeGeo = new THREE.PlaneGeometry(80, 80);
const planeMat = new THREE.ShadowMaterial({ opacity: 0.12 });
const plane = new THREE.Mesh(planeGeo, planeMat);
plane.rotation.x = -Math.PI / 2;
plane.position.y = 0.01;
plane.receiveShadow = true;
scene.add(plane);

// PODIUM 10 x 30 x 1.3 m
createBox(10, 1.3, 30, matPodest, 0, 0.65, 0);

// FRONT LED 10 x 4 m
createBox(10, 4, 0.2, matLED, 0, 1.3 + 2, -15.1);
createBox(0.3, 4.2, 0.3, matDark, -4.9, 1.3 + 2.1, -14.8);
createBox(0.3, 4.2, 0.3, matDark, 4.9, 1.3 + 2.1, -14.8);

// SIDE LEDs 3.5 x 3.5 m
createBox(0.15, 3.5, 3.5, matLED, -5.08, 1.3 + 1.75, -12.75);
createBox(0.15, 3.5, 3.5, matLED, 5.08, 1.3 + 1.75, -12.75);
createBox(0.25, 0.3, 3.5, matMetal, -5.08, 1.3 + 3.8, -12.75);
createBox(0.25, 0.3, 3.5, matMetal, 5.08, 1.3 + 3.8, -12.75);

// TOP RIG TRUSS 12 m
const rigHeight = 12;
createBox(10.4, 0.9, 20, matTruss, 0, rigHeight, -1);

const colHeight = rigHeight - 1.3;
const colThickness = 0.3;
createBox(colThickness, colHeight, colThickness, matDark, -5.2, 1.3 + colHeight/2, 8.5);
createBox(colThickness, colHeight, colThickness, matDark, 5.2, 1.3 + colHeight/2, 8.5);
createBox(colThickness, colHeight, colThickness, matDark, -5.2, 1.3 + colHeight/2, -10.5);
createBox(colThickness, colHeight, colThickness, matDark, 5.2, 1.3 + colHeight/2, -10.5);

createBox(0.2, colHeight - 2, 0.2, matMetal, -2.5, 1.3 + (colHeight - 2)/2, 8.5);
createBox(0.2, colHeight - 2, 0.2, matMetal, 2.5, 1.3 + (colHeight - 2)/2, 8.5);
createBox(0.2, colHeight - 2, 0.2, matMetal, -2.5, 1.3 + (colHeight - 2)/2, -10.5);
createBox(0.2, colHeight - 2, 0.2, matMetal, 2.5, 1.3 + (colHeight - 2)/2, -10.5);

// FRONT ROOF TRUSS 7.5 m
const frontRigHeight = 7.5;
createBox(10.4, 0.7, 4, matTruss, 0, frontRigHeight, -13.5);

const frontColH = frontRigHeight - 1.3;
createBox(0.25, frontColH, 0.25, matDark, -4.9, 1.3 + frontColH/2, -13.8);
createBox(0.25, frontColH, 0.25, matDark, 4.9, 1.3 + frontColH/2, -13.8);

// SIDE TRUSS 6 m
const sideRigHeight = 6;
createBox(0.6, 0.6, 20, matTruss, -5.5, sideRigHeight, -1);
createBox(0.6, 0.6, 20, matTruss, 5.5, sideRigHeight, -1);

// BRACED CONNECTIONS
createBox(0.15, 0.15, 9, matMetal, -3.5, rigHeight - 1.5, 4.5);
createBox(0.15, 0.15, 9, matMetal, 3.5, rigHeight - 1.5, 4.5);

// LIGHTING RIGS
const lightPositions = [
  [-4, rigHeight - 0.8, 0],
  [-2, rigHeight - 0.8, 3],
  [0, rigHeight - 0.8, 6],
  [2, rigHeight - 0.8, 3],
  [4, rigHeight - 0.8, 0],
  [-3, rigHeight - 0.8, -8],
  [3, rigHeight - 0.8, -8],
];

lightPositions.forEach(pos => {
  createBox(0.35, 0.35, 0.4, matDark, pos[0], pos[1], pos[2]);
});

// TRIM & RAILS
createBox(10, 0.15, 0.15, matDark, 0, 1.3 + 0.08, -15.08);
createBox(10, 0.15, 0.15, matDark, 0, 1.3 + 0.08, 15.08);
createBox(0.08, 1, 0.08, matMetal, -5.2, 1.3 + 0.5, -14.5);
createBox(0.08, 1, 0.08, matMetal, 5.2, 1.3 + 0.5, -14.5);

// ANIMATION LOOP
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();

// WINDOW RESIZE
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
