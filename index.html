<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELEKTRO SCENA — Wizualizacja 3D</title>
<style>
  body { 
    margin: 0; 
    overflow: hidden; 
    background: #fff; 
    font-family: Arial, sans-serif; 
  }
  #info {
    position: absolute; 
    top: 18px; 
    left: 18px; 
    z-index: 10;
    background: rgba(255,255,255,0.95);
    padding: 16px 20px; 
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    pointer-events: none; 
    user-select: none;
  }
  #info h1 { 
    margin: 0 0 8px; 
    font-size: 18px; 
    font-weight: bold;
    letter-spacing: 0.5px; 
    color: #000; 
  }
  #info p { 
    margin: 4px 0; 
    font-size: 12px; 
    color: #555; 
    line-height: 1.6; 
  }
  #canvas-container { 
    width: 100vw; 
    height: 100vh; 
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="info">
  <h1>⚡ ELEKTRO SCENA — MODEL 3D</h1>
  <p><strong>Wymiary:</strong> 10 m × 30 m | Podest: 1.3 m | Rig: 12 m</p>
  <p><strong>Elementy:</strong> LED front 10×4 m + boki | Truss | Oświetlenie</p>
  <p><strong>Sterowanie:</strong> Przeciąg myszy = obrót | Scroll = zoom | Prawy klik = pan</p>
</div>
<div id="canvas-container"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- SCENA I RENDERER ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f0f0);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(25, 16, 28);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5, -2);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.autoRotate = false;

// --- ŚWIATŁO ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
dirLight.position.set(-12, 28, 18);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 80;
dirLight.shadow.camera.left = -25;
dirLight.shadow.camera.right = 25;
dirLight.shadow.camera.top = 30;
dirLight.shadow.camera.bottom = -15;
dirLight.shadow.bias = -0.0008;
scene.add(dirLight);

// Światło boczne (wypełniające)
const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
fillLight.position.set(15, 12, -8);
scene.add(fillLight);

// --- MATERIAŁY ---
const matPodest = new THREE.MeshStandardMaterial({ 
  color: 0xf5f5f5, 
  roughness: 0.85, 
  metalness: 0.05 
});
const matDark = new THREE.MeshStandardMaterial({ 
  color: 0x1a1a1a, 
  roughness: 0.8, 
  metalness: 0.15 
});
const matLED = new THREE.MeshStandardMaterial({ 
  color: 0x0d0d0d, 
  roughness: 0.3, 
  metalness: 0.3 
});
const matTruss = new THREE.MeshStandardMaterial({ 
  color: 0xd8d8d8, 
  roughness: 0.6, 
  metalness: 0.2 
});
const matMetal = new THREE.MeshStandardMaterial({ 
  color: 0xb0b0b0, 
  roughness: 0.5, 
  metalness: 0.4 
});

const edgeMat = new THREE.LineBasicMaterial({ color: 0x333333, linewidth: 1 });

// Funkcja: box z cieniami i krawędziami
function createBox(w, h, d, material, x, y, z, parent = scene) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  
  const edges = new THREE.EdgesGeometry(geo);
  const lines = new THREE.LineSegments(edges, edgeMat);
  mesh.add(lines);
  
  parent.add(mesh);
  return mesh;
}

// --- POD��OGA / GRID ---
const gridHelper = new THREE.GridHelper(50, 50, 0xcccccc, 0xe8e8e8);
gridHelper.position.y = 0.02;
scene.add(gridHelper);

// Płaszczyzna do odbijania cieni
const planeGeo = new THREE.PlaneGeometry(80, 80);
const planeMat = new THREE.ShadowMaterial({ opacity: 0.12 });
const plane = new THREE.Mesh(planeGeo, planeMat);
plane.rotation.x = -Math.PI / 2;
plane.position.y = 0.01;
plane.receiveShadow = true;
scene.add(plane);

// --- PODEST 10 x 30 x 1.3 m (białe tło sceny) ---
createBox(10, 1.3, 30, matPodest, 0, 0.65, 0);

// --- LED FRONT (10 x 4 m) ---
// Panel LED na przedniej krawędzi
createBox(10, 4, 0.2, matLED, 0, 1.3 + 2, -15.1);
// Wsparcie LED - dwa słupki boczne
createBox(0.3, 4.2, 0.3, matDark, -4.9, 1.3 + 2.1, -14.8);
createBox(0.3, 4.2, 0.3, matDark, 4.9, 1.3 + 2.1, -14.8);

// --- LED BOGI (lewy i prawy) 3.5 x 3.5 m ---
createBox(0.15, 3.5, 3.5, matLED, -5.08, 1.3 + 1.75, -12.75);
createBox(0.15, 3.5, 3.5, matLED, 5.08, 1.3 + 1.75, -12.75);

// Wsparcie boczne LED
createBox(0.25, 0.3, 3.5, matMetal, -5.08, 1.3 + 3.8, -12.75);
createBox(0.25, 0.3, 3.5, matMetal, 5.08, 1.3 + 3.8, -12.75);

// --- TOP RIG TRUSS (12 m) ---
// Główna belka truss
const rigHeight = 12;
createBox(10.4, 0.9, 20, matTruss, 0, rigHeight, -1);

// Cztery słupy główne (narożniki)
const colHeight = rigHeight - 1.3;
const colThickness = 0.3;
createBox(colThickness, colHeight, colThickness, matDark, -5.2, 1.3 + colHeight/2, 8.5);
createBox(colThickness, colHeight, colThickness, matDark, 5.2, 1.3 + colHeight/2, 8.5);
createBox(colThickness, colHeight, colThickness, matDark, -5.2, 1.3 + colHeight/2, -10.5);
createBox(colThickness, colHeight, colThickness, matDark, 5.2, 1.3 + colHeight/2, -10.5);

// Pośrednie słupy (wsparcie konstrucji)
createBox(0.2, colHeight - 2, 0.2, matMetal, -2.5, 1.3 + (colHeight - 2)/2, 8.5);
createBox(0.2, colHeight - 2, 0.2, matMetal, 2.5, 1.3 + (colHeight - 2)/2, 8.5);
createBox(0.2, colHeight - 2, 0.2, matMetal, -2.5, 1.3 + (colHeight - 2)/2, -10.5);
createBox(0.2, colHeight - 2, 0.2, matMetal, 2.5, 1.3 + (colHeight - 2)/2, -10.5);

// --- FRONT ROOF TRUSS (niższy 7.5 m) ---
const frontRigHeight = 7.5;
createBox(10.4, 0.7, 4, matTruss, 0, frontRigHeight, -13.5);

// Słupy front roof (połączenie z podelem)
const frontColH = frontRigHeight - 1.3;
createBox(0.25, frontColH, 0.25, matDark, -4.9, 1.3 + frontColH/2, -13.8);
createBox(0.25, frontColH, 0.25, matDark, 4.9, 1.3 + frontColH/2, -13.8);

// --- SIDE TRUSS (boczne 6 m) ---
const sideRigHeight = 6;
createBox(0.6, 0.6, 20, matTruss, -5.5, sideRigHeight, -1);
createBox(0.6, 0.6, 20, matTruss, 5.5, sideRigHeight, -1);

// --- BRACED CONNECTIONS (diagonalne wsparcia) ---
// Diagonale top rig
createBox(0.15, 0.15, 9, matMetal, -3.5, rigHeight - 1.5, 4.5);
createBox(0.15, 0.15, 9, matMetal, 3.5, rigHeight - 1.5, 4.5);

// --- LIGHTING RIGS (symulacja oświetlenia) ---
// Liczba reflektorów na górnym rigu
const lightPositions = [
  [-4, rigHeight - 0.8, 0],
  [-2, rigHeight - 0.8, 3],
  [0, rigHeight - 0.8, 6],
  [2, rigHeight - 0.8, 3],
  [4, rigHeight - 0.8, 0],
  [-3, rigHeight - 0.8, -8],
  [3, rigHeight - 0.8, -8],
];

lightPositions.forEach(pos => {
  createBox(0.35, 0.35, 0.4, matDark, pos[0], pos[1], pos[2]);
});

// --- DODATKI: Kable, listwa na podium ---
// Listwa na krawędzi podestu (przód)
createBox(10, 0.15, 0.15, matDark, 0, 1.3 + 0.08, -15.08);
// Listwa na krawędzi podestu (tył)
createBox(10, 0.15, 0.15, matDark, 0, 1.3 + 0.08, 15.08);

// --- HANDLES / SAFETY RAILS (poręcze bezpieczeństwa) ---
createBox(0.08, 1, 0.08, matMetal, -5.2, 1.3 + 0.5, -14.5);
createBox(0.08, 1, 0.08, matMetal, 5.2, 1.3 + 0.5, -14.5);

// --- LOOP ANIMATION ---
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();

// --- OBSŁUGA OKNA ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
